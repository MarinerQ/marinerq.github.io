# Site identity and public URL. Restart Jekyll after changing this file.
locale: "en-US"
title: "Qian Hu's Homepage"
title_separator: "-"
name: "Qian Hu"
description: "Research Fellow at the University of Birmingham, working on gravitational-wave astrophysics and data analysis."
url: "https://marinerq.github.io"
baseurl: ""
repository: "MarinerQ/marinerq.github.io"
timezone: "Europe/London"
breadcrumbs: false
words_per_minute: 160
future: false
read_more: "disabled"

# Author profile and contact details.
author:
  name: "Qian Hu (胡潜)"
  avatar: "photo_QH.jpg"
  bio: "Research Fellow at the University of Birmingham"
  location: "Birmingham, UK"
  email: "q.hu@bham.ac.uk"
  github: "MarinerQ"
  orcid: "https://orcid.org/0000-0002-3033-6491"

analytics:
  provider: "google-gtag"
  google:
    tracking_id: "G-081VXCMJC7"
comments:
  provider: false

# Personal pages and downloadable files.
include:
  - _pages
  - files
exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - .bundle
  - .jekyll-cache
  - .jekyll-metadata
  - .sass-cache
  - vendor
  - node_modules
  - log
  - tmp
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo

# These older individual pages contain real work and retain their URLs.
collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
      share: false
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: false

sass:
  sass_dir: _sass
  style: compressed
permalink: /:categories/:title/

plugins:
  - jekyll-sitemap
  - jekyll-redirect-from
whitelist:
  - jekyll-sitemap
  - jekyll-redirect-from

compress_html:
  clippings: all
  ignore:
    envs: development
