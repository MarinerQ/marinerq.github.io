{% include base_path %}

<link rel="icon" type="image/png" href="{{ base_path }}/images/site-logo.png">
<link rel="apple-touch-icon" href="{{ base_path }}/images/site-logo.png">
<meta name="theme-color" content="#315f73">
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.min.css">

{% if page.math or content contains '$' or content contains '\(' or content contains '\[' %}
<script>
  window.MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      processEscapes: true,
      tags: 'all'
    }
  };
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@4.1.3/tex-mml-chtml.js"></script>
{% endif %}
